<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FED264">
<title>Poci - Kantong Simpanan</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Layar login -->
<section id="screen-login" class="screen">
  <div class="login-box">
    <div class="login-logo">Poci</div>
    <p class="login-sub">Kantong simpananmu, dari server rumahmu sendiri.</p>
    <form id="login-form">
      <label>Username<input id="login-username" autocomplete="username" required></label>
      <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
      <button class="btn-primary" type="submit">Masuk</button>
      <p id="login-error" class="error-text" hidden></p>
    </form>
  </div>
</section>

<!-- Kerangka aplikasi: satu layar tampil pada satu waktu, berpindah seperti tab -->
<main id="app" hidden>

  <section id="screen-home" class="screen app-screen">
    <header class="home-top">
      <button class="btn-square" id="btn-settings" aria-label="Pengaturan">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <div class="home-top-right">
        <button class="btn-square" id="btn-new-collection" aria-label="Koleksi baru">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
            <line x1="12" y1="10" x2="12" y2="16"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
          </svg>
        </button>
        <button class="btn-square" id="btn-search" aria-label="Cari">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
    </header>
    <h1 class="home-headline">Simpan sekarang.<br>Temukan kapan pun.</h1>
    <form id="quick-save-form" class="quick-save">
      <div class="quick-save-input-wrap">
        <span class="quick-save-hash">#</span>
        <input id="quick-save-input" type="url" inputmode="url" placeholder="Tempel link di sini...">
      </div>
      <button class="btn-plus" type="submit" aria-label="Simpan link">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </form>
    <button class="review-banner" id="btn-focus">
      <span class="review-bell">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
      </span>
      <span class="review-text">
        <strong id="review-count">0 simpanan baru</strong>
        <span>menunggumu di Focus Mode</span>
      </span>
      <span class="review-cta">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </span>
    </button>
    <div class="section-head">
      <h2>Koleksiku</h2>
      <button class="link-btn" id="btn-home-see-library">Lihat semua</button>
    </div>
    <div id="home-collections" class="folder-grid"></div>
  </section>

  <section id="screen-library" class="screen app-screen" hidden>
    <header class="sub-top">
      <button class="btn-square" data-nav="home" aria-label="Kembali">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <h2>Perpustakaan</h2>
    </header>
    <div class="stats-panel" id="stats-panel"></div>
    <div id="tag-cloud" class="tag-cloud"></div>
    <div class="scroll-area">
      <div id="library-items" class="item-grid"></div>
      <button class="btn-loadmore" id="btn-load-more" hidden>Muat lagi</button>
    </div>
  </section>

  <section id="screen-search" class="screen app-screen" hidden>
    <header class="search-top">
      <div class="search-input-wrap">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input id="search-input" type="search" placeholder="Cari koleksi atau simpanan..." autocomplete="off">
      </div>
      <button class="link-btn search-cancel-btn" id="btn-search-cancel">Batal</button>
    </header>
    <div class="scroll-area">
      <div id="search-initial" class="search-initial">
        <div class="stats-panel search-stats-panel" id="search-stats-panel"></div>
        <div class="section-head" style="margin-top:20px">
          <h2>Terakhir Disimpan</h2>
        </div>
        <div id="search-recent-items" class="item-grid"></div>
        <div class="section-head" style="margin-top:20px">
          <h2>Tag Populer</h2>
        </div>
        <div id="search-popular-tags" class="tag-cloud"></div>
      </div>
      <div id="search-results" class="item-grid" hidden></div>
    </div>
  </section>

  <section id="screen-detail" class="screen app-screen" hidden></section>

  <section id="screen-collection" class="screen app-screen" hidden>
    <header class="sub-top collection-header">
      <button class="btn-square" data-nav="home" aria-label="Kembali">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <div class="collection-header-center">
        <h2 id="collection-title">Koleksi</h2>
        <span id="collection-count" class="collection-header-sub">0 item</span>
      </div>
      <div class="collection-header-actions">
        <button class="btn-square btn-yellow" id="btn-collection-swipe" aria-label="Mode Geser">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="16" height="14" rx="2"/>
            <path d="M6 3h14a2 2 0 0 1 2 2v14"/>
          </svg>
        </button>
        <button class="btn-square" id="btn-collection-menu" aria-label="Menu Koleksi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
          </svg>
        </button>
      </div>
    </header>
    <div class="scroll-area">
      <div id="collection-items" class="item-grid"></div>
    </div>
    <div id="collection-select-bar" class="select-bar" hidden>
      <button class="btn-secondary" id="btn-select-remove">Keluarkan</button>
      <button class="btn-secondary btn-danger-text" id="btn-select-delete">Hapus</button>
      <button class="btn-primary" id="btn-select-done">Selesai</button>
    </div>
  </section>

  <section id="screen-focus" class="screen focus-screen" hidden></section>

  <section id="screen-settings" class="screen app-screen" hidden>
    <header class="sub-top">
      <button class="btn-square" data-nav="home" aria-label="Kembali">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <h2>Pengaturan</h2>
    </header>
    <div class="scroll-area settings-list">
      <div class="settings-card">
        <div class="setting-row">
          <span>Tampilan</span>
          <div class="segmented" id="theme-segment">
            <button data-theme-choice="system">Sistem</button>
            <button data-theme-choice="light">Terang</button>
            <button data-theme-choice="dark">Gelap</button>
          </div>
        </div>
        <div class="setting-row"><span>Mesin</span><strong>Karakeep</strong></div>
        <div class="setting-row"><span>Status server</span><strong id="server-status">Memeriksa...</strong></div>
      </div>
      <button class="btn-danger" id="btn-logout">Keluar</button>
    </div>
  </section>

</main>

<div id="bottom-sheet" class="sheet-backdrop" hidden>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <header class="sheet-header">
      <h3 class="sheet-title" id="sheet-title">Sheet</h3>
      <button class="sheet-close" id="sheet-close" aria-label="Tutup">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
